Editor teks modern, minimal, mirip VS Code — 100% standalone.

## ✨ Fitur Unggulan
- **Multi-tab** — buka banyak file sekaligus
- **Auto detect** 30+ format: .md, .html, .js, .json, .py, dll
- **Preview panel**: Markdown, HTML live, CSV table, JSON tree
- **Find & Replace** (Ctrl+F)
- **Command Palette** (Ctrl+K) untuk quick switch
- **Word wrap**, line numbers, font size, minimap

## Cara Pakai
1. Klik **New** atau **Ctrl+N** untuk file baru
2. Drag & drop file dari Explorer
3. **Open Folder** untuk load banyak file
4. **Save** (Ctrl+S) akan download file
5. Toggle **Preview** untuk lihat hasil render

> Tips: Coba buka file .csv dan .json untuk lihat preview otomatis.

### Contoh Code

  console.log("Halo " + name);
}
\`\`\`
