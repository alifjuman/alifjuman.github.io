ب أن يحذره طالب العلم حتى لا يُحرم العلم؟",options:["الكسل والبطالة وكثرة النوم والضجر وصحبة البطالين","النشاط والمذاكرة","السؤال والمناقشة","قيام الليل"],correct:0,dalil:"آفة العلم النسيان وآفة الكسل الحرمان"},{id:32,question:"ما سبيل الازدياد من العلم؟",options:["العمل بما علم وشكر النعمة وسؤال الله الزيادة","كتمان العلم ومنع الناس","ترك العمل بالعلم","الغرور بما عنده"],correct:0,dalil:"وقل رب زدني علما"},{id:33,question:"ما الدليل على فضل الورع؟",options:["قول النبي ﷺ: كن ورعا تكن أعبد الناس","الورع يمنع الرزق","الورع تشدد لا أصل له","الورع خاص بالصوفية فقط"],correct:0,dalil:"حديث: كن ورعا تكن أعبد الناس"},{id:34,question:"أي الأفعال من علامات الورع عند طالب العلم؟",options:["يتجنب الشبهات ويحترز عن الغيبة والنميمة وكثرة الكلام","يأكل من كل ما وجد حلالا أو حراما","يغتاب العلماء","يكذب لإضحاك الناس"],correct:0,dalil:"الورع يورث الحفظ والفهم"},{id:35,question:"اذكر مما يُقوي الحافظة كما في تعليم المتعلم؟",options:["السواك وقيام الليل وقراءة القرآن وكثرة الصلاة وقلة الأكل","كثرة النوم وأكل الكزبرة","أكل التفاح الحامض وشرب الماء الكثير ليلا","النظر إلى الأشياء القبيحة"],correct:0,dalil:"أسباب تقوية الحفظ: السواك، قلة الأكل"},{id:36,question:"ما الذي يُورث النسيان ويُضعف الحفظ؟",options:["أكل الكزبرة الرطبة والتفاح الحامض وكثرة الهموم والمعاصي","استعمال السواك","قراءة القرآن","قيام الليل"],correct:0,dalil:"وأما ما يورث النسيان: أكل الكزبرة، والتفاح الحامض"},{id:37,question:"ما الأعمال التي تجلب الرزق وتُكثره؟",options:["قيام الليل وكثرة الاستغفار والصدقة وصلة الرحم","النوم صباحا والكسل","قطيعة الرحم","الغناء في الخلاء"],correct:0,dalil:"أسباب جلب الرزق: قيام الليل، الاستغفار"},{id:38,question:"ما الأمور التي تمنع الرزق وتُقلله؟",options:["النوم في وقت الصبح وكثرة النوم والبطالة وقطيعة الرحم","الصدقة وصلة الرحم","الاستغفار بالأسحار","بر الوالدين"],correct:0,dalil:"وأما ما يمنع الرزق: نوم الصبحة، وكثرة النوم"},{id:39,question:"ما الذي يطيل العمر ويزيد في البركة؟",options:["صلة الرحم وبر الوالدين والإحسان والصدقة","قطيعة الرحم وعقوق الوالدين","الكذب والغيبة","ترك الصلاة"
