uslim.",ref:"Shahih Muslim",bab:"Riba",level:"Menengah"},{q:"Akad Salam sah dengan syarat?",options:["Barang disifati jelas, tempo jelas","Barang harus ada saat akad","Tanpa takaran","Boleh gharar besar"],answer:0,explain:"Salam = jual beli pesanan, barang disebutkan sifatnya, tempo jelas.",ref:"Fathul Muin",bab:"Salam",level:"Menengah"},{q:"Rahn (gadai) hukumnya?",options:["Mubah, sebagai jaminan hutang","Haram mutlak","Wajib","Makruh"],answer:0,explain:"Rahn disyariatkan QS Al-Baqarah 283.",ref:"Fathul Qorib",bab:"Rahn",level:"Dasar"},{q:"Mudharabah adalah syirkah antara?",options:["Pemodal dan pengelola","Dua pemodal","Dua pengelola tanpa modal","Peminjam dan yang meminjamkan"],answer:0,explain:"Shohibul mal dan mudharib, bagi hasil sesuai nisbah.",ref:"Fiqih Muamalah",bab:"Syirkah",level:"Dasar"},{q:"Gharar yang membatalkan jual beli adalah?",options:["Gharar fahisy (besar) yang tidak bisa dihindari","Gharar yasir","Semua gharar","Tidak ada gharar yang membatalkan"],answer:0,explain:"Gharar besar seperti jual janin di perut, ikan di laut membatalkan.",ref:"Al-Majmu'",bab:"Bai'",level:"Sulit"},{q:"Hukum jual beli crypto menurut kebanyakan fatwa kontemporer dengan gharar dan tanpa underlying?",options:["Haram / tidak sah jika gharar fahisy dan maisir","Halal mutlak","Makruh","Wajib"],answer:0,explain:"Fatwa Mesir, Turki, DSN MUI hati-hati: harus ada underlying, hindari maisir.",ref:"Fatwa DSN MUI",bab:"Crypto",level:"Sulit"},{q:"Warisan: bagian anak perempuan jika sendirian tanpa anak laki?",options:["1/2","1/3","2/3","1/4"],answer:0,explain:"QS An-Nisa 11: jika satu anak perempuan maka 1/2.",ref:"Ar-Rahabiyah",bab:"Waris",level:"Dasar"},{q:"Syirkah Inan adalah?",options:["Dua orang berserikat modal dan kerja","Hanya modal tanpa kerja","Hanya kerja tanpa modal","Pinjam meminjam"],answer:0,explain:"Inan = modal campur, kerja bersama, untung sesuai kesepakatan.",ref:"Fiqih Muamalah",bab:"Syirkah",level:"Menengah"},{q:"Khiyar majlis berlaku sampai?",options:["Berpisah dari majlis akad","1 hari","3 hari","Selamanya"],answer:0,explain:"Hadits: Al-bayyi'ani bil khiyar ma lam yatafarraqo.",ref:"Bukhari",bab:"Khiyar",level:"Dasar"},{q:"Ujrah (upah) dalam ijarah harus?",options:["Jelas jumlah dan cara bayar","Boleh tidak jelas","Boleh dengan gharar","Setelah kerja saja"],answer:0,explain:"Ujrah harus ma'lum untuk hindari perselisihan.",ref:"Fathul Muin",bab:"Ijarah",level:"Dasar"},{q:"Hiwalah adalah?",options:["Pemindahan hutang","Penghapusan hutang","Penambahan hutang","Gadai"],answer:0,explain:"Hiwalah = mengalihkan tanggungan hutang kepada pihak lain.",ref:"Fathul Qorib",bab:"Hiwalah",level:"Menengah"},{q:"Qardh (hutang) tidak boleh mengambil manfaat, kaedahnya?",options:["Kullu qardhin jarra naf'an fahuwa riba","Boleh ambil manfaat","Boleh jika ridho","Boleh jika sedikit"],answer:0,explain:"Setiap hutang yang menarik manfaat adalah riba.",ref:"Qawaid Fiqh",bab:"Qardh",level:"Dasar"},{q:"Asuransi syariah menggunakan akad?",options:["Tabarru' dan Tijarah (Wakalah/Mudharabah)","Hanya jual beli","Pinjam","Gadai"],answer:0,explain:"Asuransi syariah berbasis tolong menolong tabarru'.",ref:"DSN MUI",bab:"Asuransi Syariah",level:"Sulit"}],jinayat:[{q:"Tujuan utama fiqih jinayat adalah?",options:["Menjaga jiwa, harta, ketertiban dengan keadilan","Menghukum seberat mungkin","Balas dendam","Menakut-nakuti saja"],answer:0,explain:"Maqashid syariah hifzhun nafs, mal, dll dengan adil.",ref:"Al-Ahkam As-Sulthaniyah",bab:"Maqashid Jinayat",level:"Dasar"},{q:"Syarat qisas jiwa adalah?",options:["Korban mukallaf, pembunuhan sengaja, persamaan","Semua pembunuhan wajib qisas","Tanpa syarat","Qisas untuk luka saja"],answer:0,explain:"Qisas berlaku jika sengaja, korban ma'shum, pelaku mukallaf.",ref:"Fathul Muin",bab:"Jinayat",level:"Menengah"},{q:"Diyat pembunuhan tidak sengaja dibebankan kepada?",options:["Aqilah (keluarga pelaku)","Korban","Negara saja","Tidak ada diyat"],answer:0,explain:"Khatha' diyat ditanggung aqilah, bukan qisas.",ref:"Fiqih Jinayat",bab:"Diyat",level:"Menengah"},{q:"Hudud zina memerlukan saksi?",options:["4 saksi laki-laki adil melihat langsung","1 saksi","2 saksi","Tidak perlu saksi"],answer:0,explain:"Syarat sangat ketat untuk hudud zina 4 saksi.",ref:"QS An-Nur 4",bab:"Hudud",level:"Dasar"},{q:"Kaidah Idra'ul Hudud bis Syubhat artinya?",options:["Hindari hudud jika ada keraguan/syubhat","Tegakkan hudud meski ragu","Hudud tanpa bukti","Syubhat tidak diperhitungkan"],answer:0,explain:"Hadits: Idra'ul hudud bis syubhat - tolak hudud karena syubhat.",ref:"Hadits Tirmidzi",bab:"Qaidah Jinayat",level:"Sulit"},{q:"Pencurian yang kena potong tangan syarat nisabnya?",options:["1/4 dinar (menurut Syafi'i) dan dari hirz","Berapapun","1 dirham","Tidak ada nisab"],answer:0,explain:"Syarat sariqah: nisab 1/4 dinar, dari tempat terjaga, tidak ada syubhat.",ref:"Fathul Qorib",bab:"Sariqah",level:"Menengah"},{q:"Hukuman qadzf (menuduh zina tanpa bukti) adalah?",options:["80 cambukan","100 cambukan","Rajm","Potong tangan"],answer:0,explain:"QS An-Nur: 80 cambuk bagi penuduh zina tanpa 4 saksi.",ref:"QS An-Nur",bab:"Qadzf",level:"Dasar"},{q:"Ta'zir adalah hukuman?",options:["Yang ditentukan hakim untuk jarimah tanpa hadd/qisas","Sama dengan hudud","Hanya untuk murtad","Tidak ada dalam Islam"],answer:0,explain:"Ta'zir untuk kemaslahatan, ditentukan qodhi sesuai jarimah.",ref:"Al-Ahkam",bab:"Ta'zir",level:"Dasar"},{q:"Syarat taubat pelaku hudud sebelum ditangkap?",options:["Dapat menggugurkan hudud tertentu seperti hirabah","Tidak berpengaruh sama sekali","Menambah hukuman","Wajib tetap dihukum mati"],answer:0,explain:"QS Al-Maidah 34: taubat sebelum qudrah dapat menggugurkan hirabah.",ref:"Tafsir",bab:"Taubat",level:"Sulit"},{q:"Diyat perempuan dalam madzhab Syafi'i dibanding laki-laki?",options:["Separuh diyat laki-laki dalam qisas luka","Sama persis","Dua kali lipat","Tidak ada diyat"],answer:0,explain:"Khilaf, Syafi'i: diyat perempuan 1/2 laki-laki dalam jinayat.",ref:"Fathul Muin",bab:"Diyat",level:"Sulit"},{q:"Hirabah (perampokan bersenjata) hukumannya di QS Al-Maidah 33 bersifat?",options:["Takhyir (pilihan) bagi imam sesuai kejahatan","Hanya satu hukuman","Tidak ada hukuman","Hanya penjara"],answer:0,explain:"Ayat menyebut dibunuh, disalib, potong silang, atau diasingkan.",ref:"QS Al-Maidah 33",bab:"Hirabah",level:"Menengah"},{q:"Anak kecil melakukan jinayat, maka?",options:["Tidak ada qisas, ada diyat dari hartanya / wali dan ta'dib","Wajib qisas","Dipenjara","Dimaafkan tanpa konsekuensi"],answer:0,explain:"Anak belum mukallaf tidak qisas, tapi diyat dan pendidikan.",ref:"Fiqih Jinayat",bab:"Ahliyah",level:"Dasar"},{q:"Syurb (minum khamr) had menurut Syafi'i?",options:["40 cambukan (bisa ta'zir 80)","100 cambukan","Rajm","Potong tangan"],answer:0,explain:"Had khamr 40 menurut Syafi'i, Umar menambah jadi 80 ta'zir.",ref:"Fathul Muin",bab:"Hadd Khamr",level:"Menengah"},{q:"Prinsip utama dalam penerapan jinayat di era modern menurut ulama kontemporer?",options:["Syarat sangat ketat, kehati-hatian, keadilan, mencegah kedzaliman","Langsung terapkan tanpa proses","Serahkan ke massa","Tanpa bukti"],answer:0,explain:"Jinayat butuh pengadilan adil, bukti kuat, hindari dhulm.",ref:"Maqashid Syariah",bab:"Siyasah",level:"Menengah"},{q:"Disclaimer akademik Fiqih Jinayat dipelajari untuk?",options:["Memahami keadilan syariah & pencegahan, bukan untuk main hakim sendiri","Untuk dipraktekkan individu","Untuk kekerasan","Untuk balas dendam"],answer:0,explain:"Fiqih Jinayat dipelajari di bawah bimbingan ulama & negara, tidak untuk main hakim sendiri.",ref:"Etika Belajar",bab:"Disclaimer",level:"Dasar"}],tajwid:[{q:"Jumlah makhraj huruf menurut Ibn Jazari adalah?",options:["17","16","14","5"],answer:0,explain:"Jumhur termasuk Ibn Jazari 17 makhraj.",ref:"Jazariyah",bab:"Makharij",level:"Dasar"},{q:"Hukum Nun Sakinah dan Tanwin ada?",options:["4: Idzhar, Idgham, Iqlab, Ikhfa'","3","5","2"],answer:0,explain:"4 hukum pokok nun sakinah.",ref:"Tuhfatul Athfal",bab:"Nun Sakinah",level:"Dasar"},{q:"Idgham Bighunnah hurufnya?",options:["Yanmu (يَنْمُو)","Ra, Lam","Ba'","Semua huruf"],answer:0,explain:"Yanmu: Ya, Nun, Mim, Wawu dengan ghunnah.",ref:"Tuhfah",bab:"Idgham",level:"Dasar"},{q:"Iqlab terjadi jika nun sakinah bertemu?",options:["Ba'","Mim","Nun","Lam"],answer:0,explain:"Iqlab: nun/tanwin bertemu Ba' jadi Mim.",ref:"Tuhfah",bab:"Iqlab",level:"Dasar"},{q:"Mad Thabi'i panjangnya?",options:["2 harakah","4 harakah","6 harakah","1 harakah"],answer:0,explain:"Mad asli 2 harakah.",ref:"Jazariyah",bab:"Mad",level:"Dasar"},{q:"Mad Wajib Muttashil panjangnya?",options:["4-5 harakah","2 harakah","6 harakah wajib","Boleh 2-6"],answer:0,explain:"Muttashil 4-5 harakah wajib.",ref:"Jazariyah",bab:"Mad",level:"Menengah"},{q:"Mad Lazim Kilmi Mutsaqqal contoh?",options:["الضَّالِّينَ","ق","ن","يس"],answer:0,explain:"Dhallin ada tasydid setelah mad, 6 harakah.",ref:"Jazariyah",bab:"Mad Lazim",level:"Menengah"},{q:"Sifat huruf yang berlawanan Hams adalah?",options:["Jahr","Syiddah","Rakhawah","Isti'la'"],answer:0,explain:"Hams vs Jahr, Syiddah vs Rakhawah.",ref:"Jazariyah",bab:"Sifat",level:"Menengah"},{q:"Hukum Mim Sakinah ada?",options:["3: Ikhfa Syafawi, Idgham Syafawi, Idzhar Syafawi","4","2","5"],answer:0,explain:"3 hukum mim sakinah.",ref:"Tuhfah",bab:"Mim Sakinah",level:"Dasar"},{q:"Qalqalah hurufnya?",options:["Quthbu Jadin (قطب جد)","Yanmu","Khosho Dho'tin Qidz","Ba' saja"],answer:0,explain:"5 huruf qalqalah terkumpul di quthbu jadin.",ref:"Jazariyah",bab:"Qalqalah",level:"Dasar"},{q:"Waqaf yang lebih baik berhenti disebut?",options:["Waqaf Tam","Waqaf Qabih","Waqaf Hasan","Waqaf Jaiz"],answer:0,explain:"Waqaf Tam sempurna makna.",ref:"Ilmu Waqaf Ibtida'",bab:"Waqaf",level:"Menengah"},{q:"Bacaan gharib Majreha dalam QS Hud 41 dibaca?",options:["Imalah (e) Ra' dibaca tipis","Tafkhim","Isymam","Tashil"],answer:0,explain:"Majreha satu-satunya imalah kubra di Hafs.",ref:"Riwayat Hafs",bab:"Gharib",level:"Sulit"},{q:"Saktah dalam Qur'an Hafs ada berapa tempat?",options:["4 wajib + 2 jaiz","2","6 wajib semua","1 saja"],answer:0,explain:"Saktah: Kahfi 1-2, Yasin 52, Qiyamah 27, Muthaffifin 14.",ref:"Jazariyah",bab:"Saktah",level:"Sulit"},{q:"Hukum Ra' tafkhim jika?",options:["Fathah atau Dhommah","Kasrah","Sukun setelah kasrah","Selalu tarqiq"],answer:0,explain:"Ra' tafkhim jika fathah/dhommah, tarqiq jika kasrah.",ref:"Tajwid",bab:"Tafkhim Tarqiq",level:"Menengah"},{q:"Ghunnah paling sempurna (akmal) terjadi pada?",options:["Nun Mim bertasydid","Idzhar","Ikhfa'","Idgham bilaghunnah"],answer:0,explain:"Ghunnah akmal pada nun mim musyaddad.",ref:"Tuhfah",bab:"Ghunnah",level:"Dasar"}],balaghoh:[{q:"Balaghoh terbagi menjadi berapa ilmu?",options:["3: Ma'ani, Bayan, Badi'","2","4","1"],answer:0,explain:"Tiga ilmu balaghoh: Ma'ani, Bayan, Badi'.",ref:"Jauhar Maknun",bab:"Ta'rif Balaghoh",level:"Dasar"},{q:"Qashr (pembatasan) ada berapa thoriq?",options:["4: Nafyu Istitsna', Innama, Atf, Taqdim","2","3","5"],answer:0,explain:"Thuruq qashr: illa, innama, atf bi la/bal/lakin, taqdim.",ref:"Jauhar Maknun",bab:"Qashr",level:"Menengah"},{q:"Rukun Tasybih ada?",options:["4: Musyabbah, Musyabbah bih, Adat, Wajh Syabah","2","3","5"],answer:0,explain:"Empat rukun tasybih.",ref:"Jauhar Maknun",bab:"Tasybih",level:"Dasar"},{q:"Majaz Mursal alaqahnya ada berapa?",options:["8-9 (sababiyah, musabbabiyah, juz'iyah, dll)","2","3","5"],answer:0,explain:"Alaqah majaz mursal banyak, masyhur 8.",ref:"Jauhar Maknun",bab:"Majaz",level:"Sulit"},{q:"Istiarah Tashrihiyah adalah?",options:["Yang disebutkan musyabbah bih","Yang disebutkan musyabbah","Tanpa qarinah","Dengan adat"],answer:0,explain:"Tashrihiyah disebut musyabbah bih, makniyah disebut musyabbah.",ref:"Jauhar Maknun",bab:"Istiarah",level:"Menengah"},{q:"Jinash Tam adalah?",options:["Sama lafadz dan jenis huruf, beda makna","Beda lafadz","Sama makna","Beda huruf"],answer:0,explain:"Jinash tam: lafadz sama tapi makna beda.",ref:"Jauhar Maknun",bab:"Badi'",level:"Menengah"},{q:"Muqabalah termasuk muhassinat?",options:["Ma'nawiyah","Lafdziyah","Bukan muhassinat","Hanya ma'ani"],answer:0,explain:"Muqabalah muhassin ma'nawi.",ref:"Jauhar Maknun",bab:"Badi'",level:"Menengah"},{q:"Kalam Khabari tujuan asalnya?",options:["Memberi faidah atau faidah khabar","Meminta sesuatu","Doa","Larangan"],answer:0,explain:"Khabar untuk faidatul khabar atau lazimul faidah.",ref:"Jauhar Maknun",bab:"Khabar",level:"Dasar"},{q:"Insha' Thalabi contohnya?",options:["Amr, Nahi, Istifham, Tamanni, Nida'","Khabar","Qasam","Ta'ajjub"],answer:0,explain:"Insha' thalabi 5: amar, nahi, istifham, tamanni, nida'.",ref:"Jauhar Maknun",bab:"Insha'",level:"Dasar"},{q:"Musnad Ilaih dibuang karena?",options:["Ihtiqar, takut, ilmu, dll","Wajib selalu","Tidak boleh","Hanya untuk takut"],answer:0,explain:"Hazf musnad ilaih ada gharad balaghi.",ref:"Jauhar Maknun",bab:"Musnad Ilaih",level:"Sulit"},{q:"Tasybih Baligh adalah tasybih yang dibuang?",options:["Adat dan Wajh Syabah","Musyabbah saja","Musyabbah bih saja","Semua rukun"],answer:0,explain:"Baligh hanya musyabbah + musyabbah bih.",ref:"Jauhar Maknun",bab:"Tasybih",level:"Menengah"},{q:"Majaz Aqli adalah?",options:["Isnad fi'il kepada selain fa'il hakiki","Pemindahan lafadz","Tasybih","Kinayah"],answer:0,explain:"Majaz aqli isnad kepada sabab, zaman, makan.",ref:"Jauhar Maknun",bab:"Majaz Aqli",level:"Sulit"},{q:"Kinayah adalah?",options:["Lafadz yang dimaksud lazim maknanya beserta makna asal","Lafadz tidak diinginkan maknanya","Sama dengan majaz","Sama dengan tasybih"],answer:0,explain:"Kinayah: lafadz dipakai dengan makna lazim plus makna asal boleh.",ref:"Jauhar Maknun",bab:"Kinayah",level:"Menengah"},{q:"Saj' termasuk muhassinat?",options:["Lafdziyah","Ma'nawiyah","Bukan","Ma'ani"],answer:0,explain:"Saj' kesamaan fashilah, muhassin lafdzi.",ref:"Jauhar Maknun",bab:"Badi'",level:"Dasar"},{q:"Iltifat dalam balaghoh adalah?",options:["Perpindahan dhomir / gaya bicara untuk faidah","Mengulang kata","Membuang kata","Saj'"],answer:0,exp
