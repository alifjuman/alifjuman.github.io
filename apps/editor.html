Editor teks **standalone**, cepat, dan indah — terinspirasi VS Code + Notion. Bekerja 100% offline di browser.

## Fitur Utama
- **Multi-format**: .txt .md .json .js .ts .html .css .py .php .java .c .cpp .cs .go .rs .rb .xml .yaml .ini .env .sh .sql .log .csv .svg
- **Tab seperti VS Code** — buka banyak file sekaligus
- **Penjelajah file** di kiri dengan ikon tipe file
- **Pratinjau**: Markdown live, JSON validator/formatter, HTML preview
- **Find / Replace** dengan regex, case-sensitive, whole-word
- **Toolbar lengkap**: File Baru, Buka File, Buka Folder, Simpan, Bungkus Kata, Ukuran Font, Tema
- **Auto-save** & pulih saat reload
- **Drag & Drop** file langsung ke editor
- **Shortcut**: Ctrl+S Simpan, Ctrl+N Baru, Ctrl+O Buka, Ctrl+F Cari, Ctrl+H Ganti, Ctrl+W Tutup Tab

## Cara Pakai
1. Klik **File Baru** atau drag file dari komputer
2. Ganti tipe file di toolbar untuk syntax highlighting
3. Buka panel kanan untuk preview
4. Simpan dengan **Ctrl+S**
