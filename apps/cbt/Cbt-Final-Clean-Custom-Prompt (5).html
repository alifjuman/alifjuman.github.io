var SHEET_NAME = 'Hasil'; // nama sheet

function doPost(e) {
  try {
    var data;
    // FIX 1: Handle POST text/plain (e.postData.contents)
    if (e.postData && e.postData.contents) {
      try { data = JSON.parse(e.postData.contents); } catch(err) {
        // fallback jika bukan JSON murni
        data = { raw: e.postData.contents };
      }
    }
    // FIX 2: Handle fallback GET ?data=JSON
    if (!data || !data.nis) {
      if (e.parameter && e.parameter.data) {
        data = JSON.parse(e.parameter.data);
      }
    }
    // FIX 3: Handle ?action=add&data=...
    if ((!data || !data.nis) && e.parameter.action === 'add' && e.parameter.data) {
      data = JSON.parse(e.parameter.data);
    }
    if (!data) data = {};

    // Validasi minimal
    var nis = data.nis || '';
    var nama = data.nama || '';
    var kelas = data.kelas || 'Unknown'; // dari siswa.kelas valid
    var mapel = data.mapel || data.mapelId || 'Unknown'; // dari ujian.mapel valid
    
    var ss = SpreadsheetApp.openById(SPREADSHEET_ID);
    var sh = ss.getSheetByName(SHEET_NAME);
    if (!sh) {
      sh = ss.getSheets()[0];
    }
    // Header jika kosong
    if (sh.getLastRow() === 0) {
      sh.appendRow(['Timestamp','ID','UjianID','UjianNama','NIS','Nama','Kelas','Mapel','NilaiPG','Total','Benar','Salah','Status','WaktuMulai','WaktuSelesai','JumlahSoal','TokenUjian','Jawaban','Essay','Skor']);
    }
    sh.appendRow([
      new Date(),
      data.id || '',
      data.ujianId || '',
      data.ujianNama || data.ujian || '',
      nis,
      nama,
      kelas,
      mapel,
      data.nilaiPG || data.skor || data.total || '',
      data.total || data.skor || '',
      data.benar || '',
      data.salah || '',
      data.status || 'Selesai',
      data.waktuMulai || data.timestamp || '',
      data.waktuSelesai || '',
      data.jumlahSoal || '',
      data.tokenUjian || '',
      (typeof data.jawaban === 'string' ? data.jawaban : JSON.stringify(data.jawaban||'')).toString().substring(0,5000),
      (typeof data.jawabanEssay === 'string' ? data.jawabanEssay : JSON.stringify(data.jawabanEssay||'')).toString().substring(0,5000),
      data.skor || data.total || ''
    ]);
    
    var result = {result:'success', kelas:kelas, mapel:mapel, nis:nis, received:true};
    
    // Support JSONP callback ?callback=xxx
    if (e.parameter.callback) {
      return ContentService.createTextOutput(e.parameter.callback + "(" + JSON.stringify(result) + ")").setMimeType(ContentService.MimeType.JAVASCRIPT);
    }
    return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    var errResult = {result:'error', error: err.toString()};
    if (e.parameter && e.parameter.callback) {
      return ContentService.createTextOutput(e.parameter.callback + "(" + JSON.stringify(errResult) + ")").setMimeType(ContentService.MimeType.JAVASCRIPT);
    }
    return ContentService.createTextOutput(JSON.stringify(errResult)).setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet(e) {
  // Support GET fallback & JSONP & tarik data
  try {
    if (e.parameter.action === 'add' && e.parameter.data) {
      return doPost(e);
    }
    if (e.parameter.test) {
      return ContentService.createTextOutput(JSON.stringify({ok:true, msg:'Sheets active'})).setMimeType(ContentService.MimeType.JSON);
    }
    // Jika tidak ada action, return semua data sebagai JSON untuk fitur Tarik dari Sheets
    if (!e.parameter.action) {
      var ss = SpreadsheetApp.openById(SPREADSHEET_ID);
      var sh = ss.getSheetByName(SHEET_NAME) || ss.getSheets()[0];
      var rows = sh.getDataRange().getValues();
      var header = rows[0];
      var data = [];
      for (var i=1;i<rows.length;i++) {
        var obj={};
        for (var j=0;j<header.length;j++) obj[header[j]]=rows[i][j];
        data.push(obj);
      }
      var result = {data:data};
      if (e.parameter.callback) {
        return ContentService.createTextOutput(e.parameter.callback + "(" + JSON.stringify(result) + ")").setMimeType(ContentService.MimeType.JAVASCRIPT);
      }
      return ContentService.createTextOutput(JSON.stringify(data)).setMimeType(ContentService.MimeType.JSON);
    }
    return doPost(e);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({error:err.toString()})).setMimeType(ContentService.MimeType.JSON);
  }
