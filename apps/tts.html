i untuk mata uang digital",meaning:"Kripto menggunakan kriptografi untuk mengamankan transaksi digital yang terdesentralisasi.",tema:"teknologi"},{word:"DRONE",clue:"Pesawat tanpa awak yang dikendalikan dari jarak jauh",meaning:"Drone digunakan untuk fotografi, pemetaan, hingga pengiriman barang.",tema:"teknologi"},{word:"BIOTA",clue:"Seluruh kehidupan flora fauna di suatu wilayah",meaning:"Biota mencakup semua organisme hidup dalam ekosistem tertentu.",tema:"alam"},{word:"EKOSISTEM",clue:"Kesatuan antara makhluk hidup dan lingkungannya",meaning:"Ekosistem adalah interaksi kompleks antara komponen biotik dan abiotik yang saling bergantung.",tema:"alam"},{word:"GUNUNG",clue:"Tonjolan tinggi di permukaan bumi, Indonesia punya ratusan",meaning:"Gunung terbentuk dari aktivitas tektonik dan vulkanik, sumber kehidupan.",tema:"alam"},{word:"SAMUDRA",clue:"Lautan luas yang menutupi 71 persen bumi",meaning:"Samudra adalah hamparan air asin raksasa, pengatur iklim dunia.",tema:"alam"},{word:"MANDALIKA",clue:"Sirkuit internasional kebanggaan Lombok",meaning:"Mandalika adalah sirkuit MotoGP di NTB, mengangkat pariwisata Indonesia.",tema:"umum"},{word:"PHINISI",clue:"Kapal layar tradisional suku Bugis yang legendaris",meaning:"Phinisi dibuat tanpa paku besi, menggunakan pasak kayu, warisan UNESCO.",tema:"sejarah"},{word:"KERIS",clue:"Senjata tikam tradisional Jawa dengan pamor magis",meaning:"Keris bukan sekadar senjata, tapi simbol status dan spiritualitas.",tema:"sejarah"},{word:"SRIWIJAYA",clue:"Kerajaan maritim besar di Sumatera abad ke-7",meaning:"Sriwijaya menguasai Selat Malaka dan menjadi pusat belajar Buddha.",tema:"sejarah"},{word:"MAJAPAHIT",clue:"Kerajaan Hindu terbesar yang pernah ada di Nusantara",meaning:"Majapahit berjaya abad 13-15, wilayahnya mencakup hampir seluruh Nusantara.",tema:"sejarah"},{word:"SOTO",clue:"Sup berkuah kuning khas Indonesia dengan ayam atau daging",meaning:"Soto memiliki puluhan varian daerah, dari Lamongan hingga Betawi.",tema:"kuliner"},
