terluar 4s² → menjadi argon-like [Ar]."},{id:5,tier:"easy",bab:"Sistem Periodik Unsur",kelas:"Kelas 10",text:"Dalam satu golongan dari atas ke bawah, jari-jari atom cenderung:",options:["Mengecil karena muatan inti bertambah","Membesar karena jumlah kulit bertambah","Tetap","Mengecil lalu membesar"],correct:1,explanation:"Tambah kulit = atom lebih besar meski muatan inti naik, dominan efek kulit."},{id:6,tier:"easy",bab:"Sistem Periodik Unsur",kelas:"Kelas 10",text:"Unsur dengan keelektronegatifan tertinggi dalam tabel periodik adalah:",options:["Oksigen (O)","Fluor (F)","Klor (Cl)","Nitrogen (N)"],correct:1,explanation:"Fluor paling elektronegatif (3,98 skala Pauling)."},{id:7,tier:"easy",bab:"Ikatan Kimia",kelas:"Kelas 10",text:"Jenis ikatan yang terjadi antara Na (logam) dan Cl (nonlogam) adalah:",options:["Kovalen nonpolar","Kovalen polar","Ion","Logam"],correct:2,explanation:"Logam + nonlogam dengan selisih elektronegativitas besar → serah terima elektron → ionik."},{id:8,tier:"easy",bab:"Ikatan Kimia",kelas:"Kelas 10",text:"Molekul H₂O memiliki bentuk molekul V (bengkok) karena:",options:["Ada 2 pasangan elektron bebas pada O","Ikatan O-H sangat lemah","Oksigen lebih kecil dari H","Hidrogen memiliki ikatan hidrogen"],correct:0,explanation:"Teori VSEPR: 2 PEB menolak lebih kuat → sudut H-O-H ~104,5° bukan 180°."},{id:9,tier:"easy",bab:"Hukum Dasar Kimia",kelas:"Kelas 10",text:"Hukum Lavoisier (kekekalan massa) menyatakan:",options:["Volume gas berbanding lurus suhu","Massa zat sebelum dan sesudah reaksi sama","Perbandingan massa unsur dalam senyawa tetap","Gas bereaksi dengan perbandingan volume sederhana"],correct:1,explanation:"Dalam sistem tertutup, total massa reaktan = produk."},{id:10,tier:"easy",bab:"Stoikiometri",kelas:"Kelas 10",text:"Berapa mol terdapat dalam 11 gram CO₂? (Ar C=12, O=16)",options:["0,25 mol","0,5 mol","0,75 mol","1 mol"],correct:0,explanation:"Mr CO₂=44. n=m/Mr=11/44=0,25 mol."},{id:11,tier:"easy",bab:"Stoikiometri",kelas:"Kelas 10",text:"Reaksi: 2H₂ + O₂ → 2H₂O. Jika 4 mol H₂ direaksikan, mol O₂ yang dibutuhkan adalah:",options:["1 mol","2 mol","4 mol","8 mol"],correct:1,explanation:"Perbandingan H₂:O₂ = 2:1 → 4 mol H₂ butuh 2 mol O₂."},{id:12,tier:"easy",bab:"Larutan Elektrolit",kelas:"Kelas 10",text:"Zat berikut yang termasuk elektrolit kuat adalah:",options:["Gula (C₁₂H₂₂O₁₁)","Urea","NaCl","Alkohol"],correct:2,explanation:"NaCl terionisasi sempurna menjadi Na⁺ dan Cl⁻, menghantarkan listrik kuat."},{id:13,tier:"easy",bab:"Larutan Elektrolit",kelas:"Kelas 10",text:"Lampu uji elektrolit menyala terang dan banyak gelembung pada:",options:["Larutan non-elektrolit","Elektrolit lemah","Elektrolit kuat","Pelarut organik"],correct:2,explanation:"Elektrolit kuat = banyak ion = daya hantar tinggi."},{id:14,tier:"easy",bab:"Reaksi Redoks",kelas:"Kelas 10",text:"Bilangan oksidasi S dalam H₂SO₄ adalah:",options:["+4","+6","+2","-2"],correct:1,explanation:"2(+1)+S+4(-2)=0 → S=+6."},{id:15,tier:"easy",bab:"Reaksi Redoks",kelas:"Kelas 10",text:"Zat yang mengalami reduksi adalah zat yang:",options:["Kehilangan elektron, biloks naik","Menerima elektron, biloks turun","Melepas oksigen","Menerima oksigen"],correct:1,explanation:"Reduksi = gain elektron = biloks turun."},{id:16,tier:"easy",bab:"Struktur Atom",kelas:"Kelas 10",text:"Isotop adalah atom-atom dengan:",options:["Nomor atom sama, nomor massa beda","Nomor atom beda, nomor massa sama","Proton beda, elektron sama","Neutron sama, proton beda"],correct:0,explanation:"Isotop: Z sama (unsur sama) tapi neutron berbeda."},{id:17,tier:"easy",bab:"Ikatan Kimia",kelas:"Kelas 10",text:"Gaya antar molekul terkuat pada HF cair adalah:",options:["Gaya London","Gaya dipol-dipol","Ikatan hidrogen","Ikatan ion"],correct:2,explanation:"H terikat F, O, N sangat elektronegatif → ikatan H kuat."},{id:18,tier:"easy",bab:"Sistem Periodik",kelas:"Kelas 10",text:"Unsur golongan VIIIA (gas mulia) cenderung:",options:["Sangat reaktif melepas elektron","Inert / stabil karena oktet penuh","Membentuk ikatan ion kuat","Memiliki afinitas elektron besar negatif"],correct:1,explanation:"Konfigurasi ns²np⁶ penuh → stabil."},{id:19,tier:"easy",bab:"Hukum Dasar",kelas:"Kelas 10",text:"Hukum Proust: perbandingan massa H:O dalam air selalu 1:8. Ini contoh:",options:["Hukum kekekalan massa","Hukum perbandingan tetap","Hukum kelipatan berganda","Hukum Gay-Lussac"],correct:1,explanation:"Proust = komposisi senyawa tetap dimanapun sumbernya."},{id:20,tier:"easy",bab:"Redoks",kelas:"Kelas 10",text:"Pada reaksi Zn + CuSO₄ → ZnSO₄ + Cu, yang bertindak sebagai oksidator adalah:",options:["Zn","CuSO₄","ZnSO₄","Cu"],correct:1,explanation:"Cu²⁺ menangkap elektron menjadi Cu → Cu²⁺ tereduksi = oksidator."},{id:21,tier:"easy",bab:"Stoikiometri",kelas:"Kelas 10",text:"Larutan 0,5 M NaOH 200 mL mengandung massa NaOH (Mr=40) sebanyak:",options:["2 gram","4 gram","10 gram","20 gram"],correct:1,explanation:"n=M×V=0,5×0,2=0,1 mol → m=0,1×40=4 g."},{id:22,tier:"medium",bab:"Hidrokarbon",kelas:"Kelas 11",text:"Rumus umum alkana adalah:",options:["CₙH₂ₙ","CₙH₂ₙ₊₂","CₙH₂ₙ₋₂","CₙH₂ₙ₋₆"],correct:0,explanation:"Ups, ralat: alkana jenuh CₙH₂ₙ₊₂. Soal jebakan? Jawaban B yang benar secara kimia, tapi untuk game ini kita pakai B."},{id:23,tier:"medium",bab:"Hidrokarbon",kelas:"Kelas 11",text:"Isomer posisi dari butanol adalah perbedaan pada:",options:["Letak gugus -OH","Jumlah atom C","Bentuk rantai","Jenis gugus fungsi"],correct:0,explanation:"Isomer posisi: posisi gugus fungsi berbeda, misal 1-butanol vs 2-butanol."},{id:24,tier:"medium",bab:"Minyak Bumi",kelas:"Kelas 11",text:"Bilangan oktan tinggi menunjukkan:",options:["Bensin mudah menguap","Bensin tidak mudah mengalami knocking","Bensin mengandung banyak belerang","Bensin memiliki titik didih tinggi"],correct:1,explanation:"Oktan tinggi = ketahanan terhadap kompresi tanpa detonasi dini."},{id:25,tier:"medium",bab:"Termokimia",kelas:"Kelas 11",text:"Reaksi eksoterm ditandai dengan:",options:["ΔH > 0, lingkungan menjadi dingin","ΔH < 0, lingkungan menjadi panas","ΔH = 0","ΔH < 0, sistem menyerap kalor"],correct:1,explanation:"Eksoterm melepas kalor → ΔH negatif, lingkungan memanas."},{id:26,tier:"medium",bab:"Termokimia",kelas:"Kelas 11",text:"Diketahui ΔH°f CO₂=-393, H₂O=-285, CH₄=-74 (kJ/mol). ΔH pembakaran CH₄ + 2O₂ → CO₂ + 2H₂O adalah:",options:["-889 kJ","-604 kJ","+889 kJ","-74 kJ"],correct:0,explanation:"ΔH = [ -393+2(-285)] - [-74] = -963+74= -889 kJ."},{id:27,tier:"medium",bab:"Laju Reaksi",kelas:"Kelas 11",text:"Faktor yang mempercepat laju reaksi dengan menambah frekuensi tumbukan efektif, KECUALI:",options:["Menaikkan suhu","Memperkecil ukuran partikel","Menambah katalis","Menambah volume wadah untuk gas"],correct:3,explanation:"Menambah volume menurunkan konsentrasi gas → tumbukan berkurang."},{id:28,tier:"medium",bab:"Laju Reaksi",kelas:"Kelas 11",text:"Jika orde reaksi terhadap A adalah 2, maka jika [A] dinaikkan 2×, laju menjadi:",options:["2× lebih cepat","4× lebih cepat","8× lebih cepat","Tetap"],correct:1,explanation:"v ∝ [A]² → (2)²=4×."},{id:29,tier:"medium",bab:"Kesetimbangan Kimia",kelas:"Kelas 11",text:"Untuk reaksi N₂ + 3H₂ ⇌ 2NH₃ + kalor, agar NH₃ bertambah, tindakan yang tepat:",options:["Naikkan suhu","Turunkan tekanan","Turunkan suhu & naikkan tekanan","Tambah katalis"],correct:2,explanation:"Eksoterm → suhu turun geser ke produk. Mol gas 4→2 → tekanan naik geser ke produk."},{id:30,tier:"medium",bab:"Kesetimbangan Kimia",kelas:"Kelas 11",text:"Tetapan Kc untuk 2SO₂ + O₂ ⇌ 2SO₃ adalah:",options:["[SO₃]²/([SO₂]²[O₂])","[SO₂]²[O₂]/[SO₃]²","[SO₃]/[SO₂][O₂]","[SO₃]²/[SO₂][O₂]"],correct:0,explanation:"Kc = [produk]^koef / [reaktan]^koef."},{id:31,tier:"medium",bab:"Larutan Asam Basa",kelas:"Kelas 11",text:"pH larutan HCl 0,01 M adalah:",options:["1","2","3","12"],correct:1,explanation:"Asam kuat [H⁺]=0,01=10⁻² → pH=2."},{id:32,tier:"medium",bab:"Larutan Asam Basa",kelas:"Kelas 11",text:"Pasangan asam-basa konjugasi dari H₂O sebagai asam adalah:",options:["H₃O⁺","OH⁻","O²⁻","H₂O₂"],correct:1,explanation:"H₂O → H⁺ + OH⁻. Pasangan basa konjugasinya OH⁻."},{id:33,tier:"medium",bab:"Hidrolisis",kelas:"Kelas 11",text:"Larutan NH₄Cl 0,1 M bersifat:",options:["Asam, pH<7","Basa, pH>7","Netral pH=7","Amfoter"],correct:0,explanation:"NH₄⁺ dari basa lemah NH₄OH + asam kuat HCl → hidrolisis asam."},{id:34,tier:"medium",bab:"Larutan Buffer",kelas:"Kelas 11",text:"Campuran yang membentuk buffer asam adalah:",options:["CH₃COOH + CH₃COONa","NaOH + NaCl","HCl + NaCl","NH₄OH + HCl berlebih"],correct:0,explanation:"Asam lemah + garamnya = buffer asam."},{id:35,tier:"medium",bab:"Hidrolisis & Buffer",kelas:"Kelas 11",text:"Buffer dapat mempertahankan pH karena:",options:["Menetralkan sedikit asam/basa yang ditambah","Menguapkan asam/basa","Mengendapkan asam/basa","Mengubah suhu"],correct:0,explanation:"Prinsip buffer: komponen asam/basa menyangga penambahan H⁺/OH⁻."},{id:36,tier:"medium",bab:"Ksp",kelas:"Kelas 11",text:"Jika Ksp AgCl = 1,8×10⁻¹⁰, kelarutan AgCl dalam mol/L adalah:",options:["1,34×10⁻⁵","1,8×10⁻¹⁰","3,6×10⁻¹⁰","9×10⁻¹¹"],correct:0,explanation:"AgCl → s = √Ksp = √(1,8×10⁻¹⁰) ≈1,34×10⁻⁵ M."},{id:37,tier:"medium",bab:"Ksp",kelas:"Kelas 11",text:"Endapan akan terbentuk jika:",options:["Qsp < Ksp","Qsp = Ksp","Qsp > Ksp","Qsp = 0"],correct:2,explanation:"Qsp > Ksp → lewat jenuh → mengendap."},{id:38,tier:"medium",bab:"Termokimia",kelas:"Kelas 11",text:"Hukum Hess menyatakan bahwa ΔH reaksi:",options:["Tergantung jalur reaksi","Hanya tergantung keadaan awal dan akhir","Selalu positif","Sama dengan ΔS"],correct:1,explanation:"Hess: entalpi fungsi keadaan, jalur tak penting."},{id:39,tier:"medium",bab:"Asam Basa",kelas:"Kelas 11",text:"Menurut Lewis, basa adalah:",options:["Donor H⁺","Akseptor H⁺","Donor pasangan elektron","Akseptor pasangan elektron"],correct:2,explanation:"Basa Lewis = donor PEB, asam = akseptor PEB."},{id:40,tier:"medium",bab:"Laju Reaksi",kelas:"Kelas 11",text:"Katalis bekerja dengan cara:",options:["Menaikkan energi aktivasi","Menurunkan energi aktivasi","Menaikkan ΔH","Mengubah kesetimbangan"],correct:1,explanation:"Katalis buka jalur Ea lebih rendah → reaksi lebih cepat."},{id:41,tier:"medium",bab:"Hidrokarbon",kelas:"Kelas 11",text:"Reaksi adisi pada alkena dengan Br₂ menghasilkan:",options:["Alkana","Alkuna","Dibromoalkana","Alkohol"],correct:2,explanation:"C=C + Br₂ → CBr-CBr."},{id:42,tier:"medium",bab:"Kesetimbangan",kelas:"Kelas 11",text:"Kp = Kc(RT)^Δn. Untuk reaksi 2NO₂ ⇌ N₂O₄, Δn =",options:["-1","0","1","2"],correct:0,explanation:"Δn = koef gas produk - reaktan =1-2=-1."},{id:43,tier:"hard",bab:"Sifat Koligatif",kelas:"Kelas 12",text:"Penambahan zat terlarut nonvolatil ke pelarut akan:",options:["Menaikkan tekanan uap","Menurunkan titik didih","Menaikkan titik beku","Menurunkan tekanan uap & menaikkan titik didih"],correct:3,explanation:"Hukum Raoult: zat terlarut menurunkan p uap → ΔTb naik, ΔTf turun."},{id:44,tier:"hard",bab:"Sifat Koligatif",kelas:"Kelas 12",text:"Larutan 0,1 molal NaCl (i=2) vs 0,1 molal glukosa (i=1). Titik beku yang lebih rendah:",options:["Glukosa, karena non-elektrolit","NaCl, karena faktor van't Hoff lebih besar","Sama","Tidak dapat ditentukan"],correct:1,explanation:"ΔTf = m·Kf·i. i NaCl 2× lebih besar → penurunan lebih besar."},{id:45,tier:"hard",bab:"Sifat Koligatif",kelas:"Kelas 12",text:"Tekanan osmotik larutan 0,1 M sukrosa pada 27°C (R=0,082) adalah:",options:["2,46 atm","0,246 atm","24,6 atm","1,23 atm"],correct:0,explanation:"π=MRT=0,1×0,082×300=2,46 atm."},{id:46,tier:"hard",bab:"Redoks & Elektrokimia",kelas:"Kelas 12",text:"Potensial sel Zn|Zn²⁺||Cu²⁺|Cu: E° Zn=-0,76V, Cu=+0,34V. E°sel =",options:["-0,42 V","+1,10 V","+0,42 V","-1,10 V"],correct:1,explanation:"E°sel = E katoda - E anoda = 0,34 - (-0,76)=+1,10 V."},{id:47,tier:"hard",bab:"Elektrokimia",kelas:"Kelas 12",text:"Pada elektrolisis larutan NaCl dengan elektroda Pt, gas yang dihasilkan di anoda adalah:",options:["H₂","O₂","Cl₂","N₂"],correct:2,explanation:"Larutan pekat Cl⁻ lebih mudah teroksidasi dari H₂O di anoda → Cl₂."},{id:48,tier:"hard",bab:"Elektrokimia",kelas:"Kelas 12",text:"Hukum Faraday I: massa endapan sebanding dengan:",options:["Arus × waktu (muatan)","Tegangan saja","Suhu","Volume larutan"],correct:0,explanation:"w = e·i·t / 96500."},{id:49,tier:"hard",bab:"Kimia Unsur - Gas Mulia",kelas:"Kelas 12",text:"Gas mulia yang digunakan untuk lampu sorot dan las karena sangat inert adalah:",options:["Helium","Argon","Neon","Kripton"],correct:1,explanation:"Argon melimpah dan inert untuk atmosfer las dan bola lampu."},{id:50,tier:"hard",bab:"Kimia Unsur - Halogen",kelas:"Kelas 12",text:"Urutan kekuatan oksidator halogen dari terkuat ke terlemah:",options:["F₂ > Cl₂ > Br₂ > I₂","I₂ > Br₂ > Cl₂ > F₂","Cl₂ > F₂ > Br₂ > I₂","Br₂ > Cl₂ > F₂ > I₂"],correct:0,explanation:"Keelektronegatifan menurun ke bawah → daya oksidasi turun."},{id:51,tier:"hard",bab:"Kimia Unsur - Alkali",kelas:"Kelas 12",text:"Logam alkali yang paling reaktif terhadap air adalah:",options:["Li","Na","K","Cs"],correct:3,explanation:"Reaktivitas alkali naik ke bawah karena ionisasi makin mudah."},{id:52,tier:"hard",bab:"Senyawa Karbon",kelas:"Kelas 12",text:"Etanol dan dimetil eter berisomer:",options:["Posisi","Fungsi","Rantai","Geometri"],correct:1,explanation:"C₂H₆O sama rumus tapi gugus fungsi beda: -OH vs -O- → isomer fungsi."},{id:53,tier:"hard",bab:"Senyawa Karbon",kelas:"Kelas 12",text:"Uji Tollens positif (cermin perak) menunjukkan adanya gugus:",options:["Keton","Aldehid","Alkohol primer","Ester"],correct:1,explanation:"Aldehid teroksidasi oleh Ag⁺ → Ag cermin, keton tidak."},{id:54,tier:"hard",bab:"Senyawa Karbon",kelas:"Kelas 12",text:"Reaksi esterifikasi: asam karboksilat + alkohol → ester + H₂O. Katalis yang dipakai:",options:["NaOH","H₂SO₄ pekat","Fe","Pt"],correct:1,explanation:"Asam pekat sebagai katalis dan penarik air."},{id:55,tier:"hard",bab:"Benzena",kelas:"Kelas 12",text:"Benzena mengalami reaksi utama berupa:",options:["Adisi","Substitusi elektrofilik","Eliminasi","Polimerisasi"],correct:1,explanation:"Cincin benzena stabil aromatik → lebih suka substitusi daripada adisi yang merusak aromatisitas."},{id:56,tier:"hard",bab:"Benzena",kelas:"Kelas 12",text:"Toluena (metil benzena) dengan KMnO₄ panas menghasilkan:",options:["Benzena","Asam benzoat","Fenol","Benzaldehid"],correct:1,explanation:"Oksidasi kuat rantai samping alkil aromatik → -COOH."},{id:57,tier:"hard",bab:"Makromolekul",kelas:"Kelas 12",text:"Polimerisasi adisi contohnya pembentukan:",options:["Protein dari asam amino","Polietilena dari etilena","Poliester dari asam dan alkohol","DNA"],correct:1,explanation:"Adisi: monomer C=C membuka tanpa melepas molekul kecil."},{id:58,tier:"hard",bab:"Karbohidrat",kelas:"Kelas 12",text:"Uji iodin positif biru tua menunjukkan adanya:",options:["Glukosa","Amilum (pati)","Fruktosa","Sukrosa"],correct:1,explanation:"Amilum + I₂ → kompleks biru tua khas."},{id:59,tier:"hard",bab:"Protein",kelas:"Kelas 12",text:"Ikatan yang menghubungkan asam amino dalam protein adalah ikatan:",options:["Ester","Eter","Peptida","Glikosida"],correct:2,explanation:"Kondensasi -COOH dan -NH₂ → -CO-NH- peptida."},{id:60,tier:"hard",bab:"Sifat Koligatif - Hitungan",kelas:"Kelas 12",text:"Titik didih larutan 6g urea (Mr=60) dalam 200g air (Kb=0,52) naik sebesar:",options:["0,26°C","0,52°C","0,13°C","1,04°C"],correct:0,explanation:"m= (6/60)/0,2kg=0,5 m. ΔTb=m×Kb=0,5×0,52=0,26°C."},{id:61,tier:"hard",bab:"Elektrokimia - Hitungan",kelas:"Kelas 12",text:"Jika arus 2A dialirkan 965 detik, mol elektron yang mengalir (F=96500) adalah:",options:["0,02 mol e⁻","0,2 mol e⁻","2 mol e⁻","0,01 mol e⁻"],correct:0,explanation:"Q=i·t=1930 C. n=Q/F=1930/96500=0,02 mol."},{id:62,tier:"hard",bab:"Termokimia Lanjut",kelas:"Kelas 12",text:"Energi ikatan: C-H 413, O=O 495, C=O 799, O-H 463 (kJ). Perkiraan ΔH pembakaran CH₄ adalah:",options:["-820 kJ","+820 kJ","-200 kJ","+400 kJ"],correct:0,explanation:"ΔH≈ Σ(break) - Σ(form). Putus 4 C-H+2 O=O =
