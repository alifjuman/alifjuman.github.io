const SHEET_NAME = 'Hasil';
function doGet(e){
  try{
    const action = e.parameter.action;
    if(action==='get'){
      const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEET_NAME);
      const rows = sh.getDataRange().getValues();
      const header = rows[0];
      const data = rows.slice(1).map(r=>{
        let o={}; header.forEach((h,i)=>o[h]=r[i]);
        try{ o.jawaban = JSON.parse(o.jawaban||'[]'); }catch{}
        return o;
      });
      return ContentService.createTextOutput(JSON.stringify(data)).setMimeType(ContentService.MimeType.JSON);
    }
    if(action==='groq_list_models'){
      return handleGroqList();
    }
    return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
  }catch(err){ return ContentService.createTextOutput(JSON.stringify({error: err.message})).setMimeType(ContentService.MimeType.JSON); }
}
function doPost(e){
  try{
    const body = JSON.parse(e.postData.contents);
    if(body.action==='submit'){
      const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEET_NAME);
      sh.appendRow([body.nis, body.nisn, body.nama, body.kelas, body.paketId, body.namaPaket, JSON.stringify(body.jawaban), body.timestamp, body.status||'Terkirim', '']);
      return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
    }
    if(body.action==='correct'){
      const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEET_NAME);
      const rows = sh.getDataRange().getValues();
      for(let i=1;i<rows.length;i++){ if(String(rows[i][0])===String(body.nis) && String(rows[i][4])===String(body.paketId) && String(rows[i][7])===String(body.timestamp)){ sh.getRange(i+1, 10).setValue(body.totalSkor); sh.getRange(i+1, 9).setValue('Dinilai'); sh.getRange(i+1, 7).setValue(JSON.stringify(body.jawaban)); break; } }
      return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
    }
    if(body.action==='groq_chat'){
      const GROQ_KEY = PropertiesService.getScriptProperties().getProperty('GROQ_API_KEY');
      const payload = body.payload;
      const res = UrlFetchApp.fetch('https://api.groq.com/openai/v1/chat/completions',{ method:'post', headers:{ Authorization:'Bearer '+GROQ_KEY, 'Content-Type':'application/json' }, payload: JSON.stringify(payload), muteHttpExceptions:true });
      const j = JSON.parse(res.getContentText());
      const content = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      return ContentService.createTextOutput(JSON.stringify({content: content, raw:j})).setMimeType(ContentService.MimeType.JSON);
    }
    if(body.action==='groq_list_models'){
      return handleGroqList();
    }
  }catch(err){ return ContentService.createTextOutput(JSON.stringify({error: err.message})).setMimeType(ContentService.MimeType.JSON); }
}
function handleGroqList(){
  const GROQ_KEY = PropertiesService.getScriptProperties().getProperty('GROQ_API_KEY');
  const res = UrlFetchApp.fetch('https://api.groq.com/openai/v1/models',{ headers:{ Authorization:'Bearer '+GROQ_KEY }, muteHttpExceptions:true });
  const j = JSON.parse(res.getContentText());
  return ContentService.createTextOutput(JSON.stringify({models: j.data||[], data:j.data})).setMimeType(ContentService.MimeType.JSON);
