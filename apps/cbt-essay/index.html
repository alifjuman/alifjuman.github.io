<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBT Essay Clean - Login</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');body{font-family:Inter}</style></head><body class="bg-slate-50"><div id="app" class="min-h-screen"></div><script>
const ADMIN={u:'admin',p:'Admin2026###'};let DB={siswa:[],soal:[]};let sess=null;let sheetCache=[];
async function loadDB(){try{const r=await fetch('./database.json?v='+Date.now());DB=await r.json();localStorage.setItem('DB',JSON.stringify(DB));}catch(e){const l=localStorage.getItem('DB');if(l)DB=JSON.parse(l);} }
function renderLogin(){document.getElementById('app').innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-md bg-white rounded-[24px] shadow-xl border p-8"><h1 class="text-2xl font-bold">CBT Essay</h1><p class="text-sm text-slate-500 mb-6">Login Admin / Siswa • database.json</p><div class="flex bg-slate-100 rounded-xl p-1 mb-6"><button id="tS" onclick="setTab('s')" class="flex-1 py-2 rounded-lg bg-white shadow font-semibold">Siswa</button><button id="tA" onclick="setTab('a')" class="flex-1 py-2 rounded-lg text-slate-500">Admin</button></div><div id="fS"><input id="nis" placeholder="NIS" class="w-full border rounded-xl p-3 mb-3"><input id="nisn" type="password" placeholder="NISN" class="w-full border rounded-xl p-3 mb-4"><button onclick="loginS()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">Masuk Siswa</button><p class="text-xs text-slate-400 mt-2">Demo: 1001 / 0010010010</p></div><div id="fA" class="hidden"><input id="au" value="admin" class="w-full border rounded-xl p-3 mb-3"><input id="ap" type="password" placeholder="Admin2026###" class="w-full border rounded-xl p-3 mb-4"><button onclick="loginA()" class="w-full bg-violet-600 text-white py-3 rounded-xl font-bold">Masuk Admin</button></div><div id="msg" class="text-sm text-red-500 mt-3"></div></div></div>`;}
function setTab(t){document.getElementById('fS').classList.toggle('hidden',t!=='s');document.getElementById('fA').classList.toggle('hidden',t!=='a');}
function loginS(){const nis=document.getElementById('nis').value.trim(),nisn=document.getElementById('nisn').value.trim();const f=DB.siswa.find(s=>s.nis===nis&&s.nisn===nisn);if(!f){document.getElementById('msg').innerText='NIS/NISN salah!';return;}sess={role:'siswa',...f};sessionStorage.setItem('sess',JSON.stringify(sess));renderSiswa();}
function loginA(){const u=document.getElementById('au').value.trim(),p=document.getElementById('ap').value.trim();if((u===ADMIN.u&&p===ADMIN.p)||(DB.admin&&u===DB.admin.username&&p===DB.admin.password)){sess={role:'admin',username:u};sessionStorage.setItem('sess',JSON.stringify(sess));renderAdmin();}else{document.getElementById('msg').innerText='Admin salah!';}}
function logout(){sessionStorage.clear();location.reload();}
function renderSiswa(){const s=sess;document.getElementById('app').innerHTML=`<div class="max-w-3xl mx-auto p-4"><div class="bg-white rounded-2xl p-4 border flex justify-between mb-4"><div><b>${s.nama}</b><div class="text-xs text-slate-500">${s.nis} • ${s.kelas}</div></div><button onclick="logout()" class="text-xs bg-slate-100 px-3 py-1 rounded-lg">Logout</button></div><div id="soalWrap" class="space-y-4"></div><button onclick="submitAns()" class="w-full mt-6 bg-slate-900 text-white py-4 rounded-2xl font-bold">Kirim ke Google Sheet</button><div id="st" class="text-center text-sm mt-3"></div></div>`;let h='';DB.soal.forEach((so,i)=>{const sv=localStorage.getItem('jaw_'+s.nis+'_'+i)||'';h+=`<div class="bg-white rounded-2xl p-5 border"><div class="font-semibold text-sm">Soal ${i+1}</div><p class="text-sm my-2">${so.soal}</p><textarea id="j${i}" rows="5" class="w-full border rounded-xl p-3 text-sm">${sv}</textarea></div>`;});document.getElementById('soalWrap').innerHTML=h;DB.soal.forEach((_,i)=>{document.getElementById('j'+i).addEventListener('input',e=>localStorage.setItem('jaw_'+s.nis+'_'+i,e.target.value));});}
async function submitAns(){const gs=localStorage.getItem('gsUrl')||DB.config?.gsUrl;if(!gs){alert('Admin belum set GS URL di Settings');return;}const s=sess;const jawaban=DB.soal.map((so,i)=>({soal:so.soal,jawaban:document.getElementById('j'+i).value}));document.getElementById('st').innerText='Mengirim...';try{await fetch(gs,{method:'POST',mode:'no-cors',body:JSON.stringify({nis:s.nis,nisn:s.nisn,nama:s.nama,kelas:s.kelas,mapel:s.mapel,jawaban})});document.getElementById('st').innerHTML='✅ Terkirim! ID CBT-'+Date.now().toString(36).toUpperCase();}catch(e){document.getElementById('st').innerText='Gagal '+e;}}
function renderAdmin(){document.getElementById('app').innerHTML=`<div class="flex min-h-screen"><aside class="w-60 bg-slate-900 text-white p-6"><h2 class="font-bold">Admin CBT</h2><p class="text-xs text-slate-400 mb-6">Admin2026###</p><button onclick="tabA('siswa')" class="w-full text-left py-2 px-3 rounded-lg bg-white/10 mb-1">👥 Siswa</button><button onclick="tabA('soal')" class="w-full text-left py-2 px-3 rounded-lg hover:bg-white/10 mb-1">📝 Soal</button><button onclick="tabA('hasil')" class="w-full text-left py-2 px-3 rounded-lg hover:bg-white/10 mb-1">📊 Hasil & AI</button><button onclick="tabA('set')" class="w-full text-left py-2 px-3 rounded-lg hover:bg-white/10">⚙️ Settings</button><button onclick="logout()" class="mt-10 text-xs">Logout</button></aside><main class="flex-1 p-6 bg-slate-50"><div id="ac"></div></main></div>`;tabA('siswa');}
function tabA(t){const c=document.getElementById('ac');if(t==='siswa'){c.innerHTML=`<h3 class="font-bold text-xl mb-4">Data Siswa - database.json</h3><div class="bg-white p-4 rounded-2xl border mb-4 flex flex-wrap gap-2 items-center"><input type="file" id="xf" accept=".xlsx,.xls"><button onclick="importX()" class="px-4 py-2 bg-violet-600 text-white rounded-xl text-sm">Import Excel</button><button onclick="exportDB()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm">Export database.json</button><div id="prev" class="w-full text-xs mt-2"></div></div><div class="bg-white rounded-2xl border overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">NIS</th><th class="p-3">NISN</th><th class="p-3 text-left">Nama</th><th class="p-3">Kelas</th><th>Aksi</th></tr></thead><tbody id="tb"></tbody></table></div>`;renderTb();}if(t==='soal'){c.innerHTML=`<h3 class="font-bold text-xl mb-4">Bank Soal</h3><div id="sl" class="space-y-3"></div><button onclick="DB.soal.push({id:Date.now(),soal:'Soal baru',kunci:'',rubrik:''});tabA('soal')" class="mt-4 px-4 py-2 bg-violet-600 text-white rounded-xl text-sm">+ Soal</button> <button onclick="saveDB()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm">Simpan</button>`;document.getElementById('sl').innerHTML=DB.soal.map((s,i)=>`<div class="bg-white border rounded-xl p-4"><textarea id="so${i}" class="w-full border rounded-xl p-2 text-sm">${s.soal}</textarea><input id="sk${i}" value="${s.kunci}" class="w-full border rounded-xl p-2 text-xs mt-2"><input id="sr${i}" value="${s.rubrik}" class="w-full border rounded-xl p-2 text-xs mt-2"></div>`).join('');}if(t==='hasil'){c.innerHTML=`<h3 class="font-bold text-xl mb-4">Hasil Google Sheets</h3><div class="flex gap-2 mb-4"><button onclick="fetchSh()" class="px-4 py-2 bg-violet-600 text-white rounded-xl text-sm">Tarik Data</button><button onclick="massal()" class="px-4 py-2 bg-cyan-600 text-white rounded-xl text-sm">Koreksi Semua AI</button></div><div id="ht" class="bg-white rounded-2xl border p-4">Belum tarik</div><div id="dk" class="mt-4"></div>`;}if(t==='set'){c.innerHTML=`<h3 class="font-bold text-xl mb-4">Settings</h3><div class="bg-white rounded-2xl p-6 border max-w-xl space-y-3"><input id="gs" value="${localStorage.getItem('gsUrl')||DB.config?.gsUrl||''}" placeholder="https://script.google.com/.../exec" class="w-full border rounded-xl p-3 text-sm"><input id="gk" type="password" value="${localStorage.getItem('groqKey')||''}" placeholder="gsk_..." class="w-full border rounded-xl p-3 text-sm"><select id="gm" class="w-full border rounded-xl p-3 text-sm"><option>llama-3.3-70b-versatile</option><option>mixtral-8x7b-32768</option><option>gemma2-9b-it</option><option>llama-3.1-8b-instant</option></select><button onclick="localStorage.setItem('gsUrl',document.getElementById('gs').value);localStorage.setItem('groqKey',document.getElementById('gk').value);localStorage.setItem('gm',document.getElementById('gm').value);DB.config.gsUrl=document.getElementById('gs').value;localStorage.setItem('DB',JSON.stringify(DB));alert('Saved')" class="w-full bg-slate-900 text-white py-3 rounded-xl">Simpan</button></div>`;}}
function renderTb(){const tb=document.getElementById('tb');if(!tb)return;tb.innerHTML=DB.siswa.map((s,i)=>`<tr class="border-t"><td class="p-3">${s.nis}</td><td class="p-3 text-xs">${s.nisn}</td><td class="p-3">${s.nama}</td><td class="p-3">${s.kelas}</td><td class="p-3"><button onclick="DB.siswa.splice(${i},1);saveDB();tabA('siswa')" class="text-xs text-red-500">Hapus</button></td></tr>`).join('');}
function saveDB(){localStorage.setItem('DB',JSON.stringify(DB));alert('Saved localStorage, Export untuk push ke GitHub');}
function exportDB(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='database.json';a.click();}
function importX(){const f=document.getElementById('xf').files[0];if(!f)return alert('Pilih xlsx');const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1});const h=rows[0].map(x=>String(x).toLowerCase());const iNIS=h.findIndex(x=>x.includes('nis')&&!x.includes('nisn')),iNISN=h.findIndex(x=>x.includes('nisn')),iNama=h.findIndex(x=>x.includes('nama')),iKelas=h.findIndex(x=>x.includes('kelas'));let added=0;for(let i=1;i<rows.length;i++){const rr=rows[i];if(!rr[iNIS])continue;const nis=String(rr[iNIS]).trim();if(DB.siswa.some(s=>s.nis===nis))continue;DB.siswa.push({nis,nisn:String(rr[iNISN]||'').trim(),nama:String(rr[iNama]||''),kelas:String(rr[iKelas]||''),mapel:'B.Indonesia'});added++;}document.getElementById('prev').innerText=`Import ${added} siswa baru`;renderTb();saveDB();};r.readAsArrayBuffer(f);}
async function fetchSh(){const gs=localStorage.getItem('gsUrl')||DB.config.gsUrl;if(!gs)return alert('Set GS URL');document.getElementById('ht').innerText='Loading...';try{const res=await fetch(gs);const data=await res.json();sheetCache=data;document.getElementById('ht').innerHTML=`<table class="w-full text-sm"><thead><tr><th class="p-2 text-left">ID</th><th>NIS</th><th>Nama</th><th>Status</th><th>Skor</th><th>Aksi</th></tr></thead><tbody>${data.map(d=>`<tr class="border-t"><td class="p-2 text-xs">${d.id}</td><td class="p-2">${d.nis}</td><td class="p-2">${d.nama}</td><td class="p-2">${d.status}</td><td class="p-2 font-bold">${d.skor||'-'}</td><td class="p-2"><button onclick="koreksi(${d.rowIndex})" class="px-2 py-1 bg-violet-600 text-white rounded text-xs">Koreksi</button></td></tr>`).join('')}</tbody></table>`;}catch(e){document.getElementById('ht').innerText='Gagal '+e;}}
async function koreksi(row){const key=localStorage.getItem('groqKey'),model=localStorage.getItem('gm')||'llama-3.3-70b-versatile',gs=localStorage.getItem('gsUrl');if(!key)return alert('Isi Groq Key');const d=sheetCache.find(x=>x.rowIndex===row);const prompt=`Nilai essay siswa ${d.nama}: ${d.jawab1} ${d.jawab2} ${d.jawab3}. Rubrik ${DB.soal.map(s=>s.rubrik).join(';')}. Output JSON {"skor":0-100,"feedback":"...","rincian":"..."}`;document.getElementById('dk').innerText='AI mengoreksi...';try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model,messages:[{role:'user',content:prompt}],temperature:0.3,response_format:{type:'json_object'}})});const j=await r.json();const p=JSON.parse(j.choices[0].message.content);document.getElementById('dk').innerHTML=`<div class="bg-white border rounded-2xl p-5"><b>Skor ${p.skor}</b><br>${p.feedback}<pre class="text-xs bg-slate-50 p-3 mt-2 rounded-xl">${p.rincian||''}</pre><button onclick="upd(${row},${p.skor},'${(p.feedback||'').replace(/'/g,'')}')" class="mt-3 px-4 py-2 bg-green-600 text-white rounded-xl text-sm">Update Sheet</button></div>`;}catch(e){document.getElementById('dk').innerText='Gagal '+e;}}
async function upd(row,skor,fb){const gs=localStorage.getItem('gsUrl');await fetch(gs,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'correct',row,skor,feedback:fb,rincian:fb})});alert('Updated');}
async function massal(){for(let d of sheetCache.filter(x=>x.status!=='Sudah Dikoreksi')){await koreksi(d.rowIndex);await new Promise(r=>setTimeout(r,2500));}}
(async()=>{await loadDB();const ss=sessionStorage.getItem('sess');if(ss){sess=JSON.parse(ss);if(sess.role==='admin')renderAdmin();else renderSiswa();}else renderLogin();})();
</script></body></html>
