var SHEET_ID = 'GANTI_DENGAN_ID_SHEET_ANDA';
var SHEET_HASIL = 'Hasil';
var SHEET_SISWA = 'Siswa';

function doGet(e){
  var action = e.parameter.action;
  if(action=='ping'){
    return ContentService.createTextOutput(JSON.stringify({ok:true, msg:'pong'})).setMimeType(ContentService.MimeType.JSON);
  }
  return ContentService.createTextOutput(JSON.stringify({ok:true, version:'ULTIMATE V2'})).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e){
  try{
    var data = JSON.parse(e.postData.contents);
    var action = data.action;

    // --- GROQ PROXY ---
    if(action=='groq_proxy'){
      var groqKey = data.groqKey;
      var model = data.model || 'llama-3.1-8b-instant';
      var messages = data.messages;
      if(!groqKey) throw new Error('groqKey kosong');
      var url = 'https://api.groq.com/openai/v1/chat/completions';
      var payload = { model: model, messages: messages, temperature: 0.7, max_tokens: 4000 };
      var res = UrlFetchApp.fetch(url, {
        method:'post',
        headers:{ 'Authorization':'Bearer '+groqKey, 'Content-Type':'application/json' },
        payload: JSON.stringify(payload),
        muteHttpExceptions: true
      });
      var text = res.getContentText();
      var code = res.getResponseCode();
      if(code>=400){
        return ContentService.createTextOutput(JSON.stringify({error:'Groq error '+code+': '+text})).setMimeType(ContentService.MimeType.JSON);
      }
      // return raw groq json
      return ContentService.createTextOutput(text).setMimeType(ContentService.MimeType.JSON);
    }

    // --- SAVE HASIL + PAKET ---
    if(action=='save_hasil'){
      var ss = SpreadsheetApp.openById(SHEET_ID);
      var sh = ss.getSheetByName(SHEET_HASIL) || ss.insertSheet(SHEET_HASIL);
      // header
      if(sh.getLastRow()==0){
        sh.appendRow(['id','nis','nama','kelas','paketId','namaPaket','skor','benar','total','jawabanJSON','waktu','createdAt']);
      }
      sh.appendRow([
        data.id, data.nis, data.nama, data.kelas,
        data.paketId || '', data.namaPaket || '',
        data.skor, data.benar, data.total,
        JSON.stringify(data.jawaban||{}),
        data.waktu, new Date()
      ]);
      return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
    }

    return ContentService.createTextOutput(JSON.stringify({ok:false, error:'unknown action'})).setMimeType(ContentService.MimeType.JSON);
  }catch(err){
    return ContentService.createTextOutput(JSON.stringify({ok:false, error: err.message})).setMimeType(ContentService.MimeType.JSON);
  }
}
